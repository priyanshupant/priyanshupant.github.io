<!DOCTYPE html>

<style>
/* Quiet academic pages: typography and rules inspired by the Continuum essay. */
:root{color-scheme:light;--ink:#171717;--muted:#595959;--line:#d5d5d5;--wide:1050px;--reading:730px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.62 Georgia,"Times New Roman",serif}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-style:dashed}
a:focus-visible{outline:2px dashed var(--ink);outline-offset:4px}
.site-header{max-width:var(--wide);margin:auto;padding:19px 24px;border-bottom:1px solid var(--ink);display:flex;align-items:center;justify-content:space-between;gap:15px 35px}
.site-header .site-name{margin:0;white-space:nowrap;font-size:18px;letter-spacing:-.025em;line-height:1.2}
.site-name a{text-decoration:none}
.site-name a:hover{text-decoration:underline}
.site-header nav p{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin:0}
.site-header nav a{text-decoration:none;font:11px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.045em;text-transform:uppercase;color:#484848;padding:5px 0;border-bottom:1px solid transparent}
.site-header nav a:hover{color:var(--ink);border-bottom-color:#888}
.site-header nav a[aria-current="page"]{color:#111;border-bottom-color:#111;font-weight:700}
main{max-width:var(--reading);padding:53px 24px 75px;margin:0 auto;min-height:62vh}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:-.045em}
h1{font-size:clamp(1.9rem,3.5vw,2.35rem);line-height:1.22;margin:0 0 22px}
h2{font-size:clamp(1.3rem,2.1vw,1.5rem);line-height:1.3;margin:39px 0 15px;padding-top:15px;border-top:1px solid var(--ink)}
h3{font-size:1.16rem;line-height:1.4}
p{margin:0 0 1.08em}
main p{max-width:67ch}
ul{padding:0;list-style:none;margin:18px 0 26px}
li{border-top:1px solid var(--line);padding:12px 0 14px;margin:0}
li:last-child{border-bottom:1px solid var(--line)}
li strong{font:600 12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace}
.page-publications>p:first-child{font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);margin-bottom:20px}
.page-publications ul li{padding:16px 0 18px}
.page-activities h1:not(:first-child){font-size:clamp(1.6rem,2.6vw,1.95rem);border-top:2px solid var(--ink);margin:48px 0 18px;padding-top:22px}
.page-activities li{padding:11px 0 13px}
.page-notes h2{margin-top:32px}
.page-personal h3{font:12px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.055em;color:var(--muted);margin:0 0 24px}
.page-personal img{display:block;width:min(100%,430px);max-height:520px;height:auto;object-fit:contain;margin:0}
.page-personal h1{margin:28px 0 0}
.page-contact h1{max-width:800px}
.page-home{max-width:810px}
.page-home .home-title{font-size:clamp(2.3rem,4vw,2.9rem);letter-spacing:-.045em;margin:0 0 35px}
.home-intro{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:33px;align-items:start;margin-bottom:37px;padding-bottom:31px;border-bottom:1px solid var(--ink)}
.home-intro .portrait{margin:0}
.home-intro .portrait img{display:block;width:100%;height:auto}
.home-intro h2{margin:0 0 14px;padding:0;border:0;font-size:clamp(1.5rem,2.5vw,1.8rem)}
.home-intro p{font-size:16px}
.page-home>h2:first-of-type{margin-top:0}
.page-home h2{margin-top:39px}
.page-home ul li{padding:10px 0}
@media(max-width:760px){
 body{font-size:16px;line-height:1.58}
 .site-header{padding:20px 18px;align-items:flex-start;flex-direction:column;gap:14px}
 .site-header nav p{gap:6px 16px}
 main{padding:38px 19px 65px}
 h1{margin-bottom:20px}
 h2{margin-top:34px}
 .page-home .home-title{margin-bottom:27px}
 .home-intro{grid-template-columns:minmax(0,1fr) 145px;gap:24px;padding-bottom:26px;margin-bottom:30px}
 .home-intro p{font-size:16px}
}
@media(max-width:520px){
 .home-intro{display:flex;flex-direction:column;gap:20px}
 .home-intro .portrait{order:-1;width:158px;max-width:65%}
 .home-intro h2{font-size:1.5rem}
 .page-home .home-title{font-size:clamp(2.2rem,8vw,2.6rem);margin-bottom:24px}
 .site-header nav p{gap:5px 12px}
 .site-header nav a{font-size:10.5px}
 .page-personal img{max-width:100%}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{
 body{font-size:12pt}
 .site-header{padding:8px 0}
 .site-header nav{display:none}
 main{padding:20px 0}
 h1,h2{break-after:avoid}
 li{break-inside:avoid}
}
</style>
