<style>
/* A simple Google Sites-like academic layout. */
* { box-sizing: border-box; }
body {
  margin: 0;
  color: #222;
  background: #fff;
  font: 17px/1.65 Georgia, "Times New Roman", serif;
}
.site { max-width: 930px; margin: 0 auto; padding: 0 24px 70px; }
.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px 30px;
  min-height: 56px;
  background: #171717;
  padding: 12px 19px;
}
.site-name { color: #eee; font-size: 18px; white-space: nowrap; }
.site-name a { color: inherit; text-decoration: none; }
.site-header nav { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.site-header nav a {
  color: #c9c9c9;
  font: 14px/1.4 Arial, Helvetica, sans-serif;
  text-decoration: none;
}
.site-header nav a:hover, .site-header nav a[aria-current="page"] { color: white; }
.site-header nav a[aria-current="page"] { font-weight: bold; }
.hero { margin: 0; }
.hero img { display: block; width: 100%; height: auto; }
main { max-width: 845px; margin: 53px auto 0; padding: 0 12px; }
h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; }
h1 { font-size: 23px; margin: 0 0 20px; }
h2 { font-size: 20px; margin: 36px 0 13px; }
h2:first-child { margin-top: 0; }
h3 { font-size: 18px; }
p { margin: 0 0 14px; }
main a { color: #3778bf; }
ul { margin: 10px 0 27px; padding-left: 27px; }
li { margin-bottom: 12px; }
.page-publications li { margin-bottom: 24px; }
.page-activities h1:not(:first-child) { margin-top: 43px; }
.page-personal img { display: block; max-width: 100%; height: auto; }
@media (max-width: 660px) {
  body { font-size: 16px; }
  .site { padding: 0 14px 50px; }
  .site-header { align-items: flex-start; flex-direction: column; padding: 13px 15px; gap: 11px; }
  .site-name { font-size: 17px; }
  .site-header nav { gap: 8px 15px; }
  .site-header nav a { font-size: 13px; }
  main { margin-top: 34px; padding: 0 3px; }
  h1 { font-size: 22px; }
  h2 { font-size: 19px; margin-top: 30px; }
}
</style>
