# Pages CMS: edit this site's content in the rich-text editor.
media:
  input: media
  output: /media

content:
  - name: home
    label: Home
    type: file
    path: index.html
    format: yaml-frontmatter
    fields:
      - name: title
        label: Page title
        type: string
        readonly: true
      - name: layout
        type: string
        hidden: true
      - name: page_key
        type: string
        hidden: true
      - name: body
        label: Page content
        type: rich-text
        description: Edit text, headings, links, and lists. The site layout stays unchanged.
        options:
          format: html
