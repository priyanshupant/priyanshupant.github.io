<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300&amp;display=swap" rel="stylesheet">
<style>
/* Google Sites-like personal academic webpage. */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: white; color: #252525; font: 17px/1.82 Georgia,"Times New Roman",serif; }
a { color: #397be4; text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible { outline: 2px solid #397be4; outline-offset: 3px; }
.topbar {
  height: 55px; padding: 0 18px; background: #050505; color: #f6f6f6;
  display: flex; align-items: center; gap: 16px; width: 100%;
  font-family: "Lato",Arial,Helvetica,sans-serif; font-weight: 300;
}
.topbar .site-name { color: white; font: 300 27px/1.3 "Lato",Arial,Helvetica,sans-serif; white-space: nowrap; }
.topbar .site-name:hover { text-decoration: none; }
.topbar nav { display: flex; align-items: center; gap: 36px; margin-left: auto; }
.topbar nav a { color: #e7e7e7; text-decoration: none; font: 300 21px/1.3 "Lato",Arial,Helvetica,sans-serif; white-space: nowrap; }
.topbar nav a:hover,.topbar nav a[aria-current="page"] { color: #fff; }

.home-layout {
  width: min(1160px,calc(100% - 52px)); margin: 24px auto 75px;
  display: grid; grid-template-columns: 267px minmax(0,1fr); column-gap: 135px; align-items: start;
}
.home-side { min-width: 0; }
.home-side .portrait { display: block; width: 267px; height: 319px; max-width: 100%; object-fit: cover; object-position: center 38%; border-radius: 10px; }
.home-main { padding-top: 26px; }
main { min-width: 0; }
h1,h2,h3 { font-family: Georgia,"Times New Roman",serif; }
h1 { font-size: 23px; line-height: 1.35; margin: 0 0 18px; }
h2 { font-size: 19px; line-height: 1.4; margin: 0 0 10px; }
h2:not(:first-child) { margin-top: 25px; }
h3 { font-size: 18px; }
p { margin: 0 0 10px; }
ul { margin: 12px 0 26px; padding-left: 38px; }
li { margin: 0 0 9px; }
.page-main { max-width: 1120px; width: calc(100% - 92px); margin: 52px auto 90px; }
.page-main h1:not(:first-child) { margin-top: 35px; }
.page-publications li { margin-bottom: 22px; }
.page-personal img { max-width: 100%; height: auto; }
@media (max-width: 1260px) {
  .home-layout { column-gap: clamp(45px,9vw,135px); }
}
@media (max-width: 850px) {
  .home-layout { grid-template-columns: 220px minmax(0,1fr); column-gap: 38px; }
  .home-side .portrait { width: 220px; height: 275px; }
  .topbar nav { gap: 25px; }
  .topbar nav a { font-size: 19.5px; }
}
@media (max-width: 660px) {
  body { font-size: 16px; line-height: 1.67; }
  .topbar { height: auto; min-height: 55px; padding: 8px 16px; flex-wrap: wrap; gap: 6px 14px; }
  .topbar .site-name { font-size: 23px; }
  .topbar nav { order: 2; width: 100%; margin: 0; flex-wrap: wrap; gap: 8px 18px; }
  .home-layout { display: block; width: auto; margin: 23px 19px 65px; }
  .home-side .portrait { width: min(267px,100%); height: auto; aspect-ratio: 267/319; object-fit: cover; }
  .home-main { padding-top: 25px; }
  .page-main { width: auto; margin: 30px 19px 65px; }
  h1 { font-size: 22px; }
  h2 { font-size: 19px; }
  ul { padding-left: 25px; }
}

/* Compact visitor-country graph, at bottom-right of the homepage. */
.historic-country-graph { width:345px; max-width:100%; margin:38px 0 0 auto; text-align:center; color:#252525; }
.historic-country-graph .country-graph-heading { font:16px/1.35 Georgia,"Times New Roman",serif; }
.historic-country-graph .country-graph-subtitle { margin-bottom:5px; font:11px/1.4 Arial,Helvetica,sans-serif; color:#777; }
.historic-country-graph svg { display:block; width:100%; height:auto; overflow:visible; }
.historic-country-graph .country-edge { fill:none; stroke:#777; stroke-width:1.45; stroke-linecap:round; }
.historic-country-graph .country-proximity { stroke:#9aaabd; stroke-width:1.3; stroke-dasharray:2 5; }
.historic-country-graph .country-node circle { fill:#fff; stroke:#777; stroke-width:1; }
.historic-country-graph .country-flag { font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; text-anchor:middle; dominant-baseline:central; }
.historic-country-graph .country-count { font:11px/1 Arial,Helvetica,sans-serif; fill:#5c5c5c; text-anchor:middle; }
.historic-country-graph .country-graph-footer { margin-top:4px; font:11px/1.5 Arial,Helvetica,sans-serif; color:#6a6a6a; }
.historic-country-graph .country-graph-legend { font:10px/1.4 Arial,Helvetica,sans-serif; color:#8a8a8a; }
@media(max-width:660px) { .historic-country-graph { width:min(320px,100%); margin-top:30px; } }

</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Personal academic webpage of Priyanshu Pant">
<title>{{ page.title | escape }} — Priyanshu Pant</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
</head>
<body>
<header class="topbar">
<a class="site-name" href="index.html">Priyanshu Pant</a>
<nav aria-label="Main navigation">
<a href="index.html"{% if page.page_key == 'home' %} aria-current="page"{% endif %}>Home</a>
<a href="publications.html"{% if page.page_key == 'publications' %} aria-current="page"{% endif %}>Research</a>
<a href="activities.html"{% if page.page_key == 'activities' %} aria-current="page"{% endif %}>Activities</a>
<a href="notes.html"{% if page.page_key == 'notes' %} aria-current="page"{% endif %}>Notes</a>
<a href="personal.html"{% if page.page_key == 'personal' %} aria-current="page"{% endif %}>Personal</a>
</nav>
</header>
{% if page.page_key == 'home' %}
<div class="home-layout">
<aside class="home-side">
<img class="portrait" src="portrait.jpg" alt="Priyanshu Pant">
</aside>
<main class="home-main">
{{ content }}
<aside class="historic-country-graph" aria-label="Visitor graph showing historical country counts">
<div class="country-graph-heading">Visitors</div>
<div class="country-graph-subtitle">Historical visitors by country</div>
<svg viewBox="0 0 350 346" role="img" aria-label="Nine country flags with weighted circles and verified Flag Counter visitor totals: India 165, United States 62, France 5, Brazil 3, and Netherlands, Belgium, Singapore, New Zealand, Germany one each. Solid lines connect neighbouring countries, dotted lines are geographic bridges.">
<path class="country-edge" d="M164 34 Q123 60 98 99"/>
<path class="country-edge" d="M164 34 Q184 63 195 100"/>
<path class="country-edge" d="M164 34 Q244 55 276 100"/>
<path class="country-edge country-proximity" d="M98 99 Q60 132 44 173"/>
<path class="country-edge country-proximity" d="M44 173 Q37 215 59 252"/>
<path class="country-edge country-proximity" d="M276 100 Q274 137 256 169"/>
<path class="country-edge country-proximity" d="M256 169 Q273 203 258 238"/>
<path class="country-edge country-proximity" d="M258 238 Q293 264 310 303"/>
<g class="country-node" transform="translate(164 34)"><title>Belgium: 1 historical visitor</title><circle r="11.9"/><text class="country-flag" x="0" y="1" font-size="19">🇧🇪</text><text class="country-count" x="0" y="25.9">1</text></g>
<g class="country-node" transform="translate(98 99)"><title>France: 5 historical visitors</title><circle r="13.0"/><text class="country-flag" x="0" y="1" font-size="19">🇫🇷</text><text class="country-count" x="0" y="27.0">5</text></g>
<g class="country-node" transform="translate(195 100)"><title>Netherlands: 1 historical visitor</title><circle r="11.9"/><text class="country-flag" x="0" y="1" font-size="19">🇳🇱</text><text class="country-count" x="0" y="25.9">1</text></g>
<g class="country-node" transform="translate(276 100)"><title>Germany: 1 historical visitor</title><circle r="11.9"/><text class="country-flag" x="0" y="1" font-size="19">🇩🇪</text><text class="country-count" x="0" y="25.9">1</text></g>
<g class="country-node" transform="translate(44 173)"><title>United States: 62 historical visitors</title><circle r="18.0"/><text class="country-flag" x="0" y="1" font-size="23">🇺🇸</text><text class="country-count" x="0" y="32.0">62</text></g>
<g class="country-node" transform="translate(59 252)"><title>Brazil: 3 historical visitors</title><circle r="12.5"/><text class="country-flag" x="0" y="1" font-size="19">🇧🇷</text><text class="country-count" x="0" y="26.5">3</text></g>
<g class="country-node" transform="translate(256 169)"><title>India: 165 historical visitors</title><circle r="22.4"/><text class="country-flag" x="0" y="1" font-size="23">🇮🇳</text><text class="country-count" x="0" y="36.4">165</text></g>
<g class="country-node" transform="translate(258 238)"><title>Singapore: 1 historical visitor</title><circle r="11.9"/><text class="country-flag" x="0" y="1" font-size="19">🇸🇬</text><text class="country-count" x="0" y="25.9">1</text></g>
<g class="country-node" transform="translate(310 303)"><title>New Zealand: 1 historical visitor</title><circle r="11.9"/><text class="country-flag" x="0" y="1" font-size="19">🇳🇿</text><text class="country-count" x="0" y="25.9">1</text></g>
</svg>
<div class="country-graph-legend">━━ border &nbsp; ┄┄ proximity</div>
<div class="country-graph-footer">
<div id="historic-visit-total" title="Country weights show historical Flag Counter counts only. GoatCounter measures newer visits differently.">240 historical · <a href="https://priyanshupant.goatcounter.com/" target="_blank" rel="noopener noreferrer">newer visits ↗</a></div>
<a href="https://info.flagcounter.com/mvlt" target="_blank" rel="noopener noreferrer">Historic source</a>
</div>
</aside>
</main>
</div>
{% else %}
<main class="page-main page-{{ page.page_key }}">
{{ content }}
</main>
{% endif %}
<script>
/* Combine summary totals only if public GoatCounter counts are enabled.
   Country vertex weights remain historic; no private analytics API key is exposed. */
(function() {
  var target = document.getElementById('historic-visit-total');
  if (!target || !window.fetch) return;
  fetch('https://priyanshupant.goatcounter.com/counter/TOTAL.json')
    .then(function(r) { if (!r.ok) throw new Error('Unavailable'); return r.json(); })
    .then(function(data) {
      var count = Number(String(data.count == null ? '' : data.count).replace(/[^0-9]/g, ''));
      if (!Number.isSafeInteger(count) || count < 0) return;
      target.textContent = '\u2248 ' + (240 + count).toLocaleString() + ' combined (240 historic + ' + count.toLocaleString() + ' new)';
    }).catch(function() { /* Keep verified 240 historical total displayed. */ });
})();
</script>
<script data-goatcounter="https://priyanshupant.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
