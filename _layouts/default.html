<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&amp;display=swap" rel="stylesheet">
<style>
/* Google Sites-like personal academic webpage. */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: white; color: #252525; font: 400 17px/1.82 "Lato",Arial,Helvetica,sans-serif; }
a { color: #397be4; text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible { outline: 2px solid #397be4; outline-offset: 3px; }
.topbar {
  height: 55px; padding: 0 18px; background: #fff; color: #252525;
  display: flex; align-items: center; gap: 16px; width: 100%;
  font-family: "Lato",Arial,Helvetica,sans-serif; font-weight: 300;
}
.topbar .site-name { color: #252525; font: 300 27px/1.3 "Lato",Arial,Helvetica,sans-serif; white-space: nowrap; }
.topbar .site-name:hover { text-decoration: none; }
.topbar nav { display: flex; align-items: center; gap: 36px; margin-left: auto; }
.topbar nav a { color: #333; text-decoration: none; font: 300 21px/1.3 "Lato",Arial,Helvetica,sans-serif; white-space: nowrap; }
.topbar nav a:hover,.topbar nav a[aria-current="page"] { color: #111; }

.home-layout {
  width: min(1160px,calc(100% - 52px)); margin: 24px auto 75px;
  display: grid; grid-template-columns: 267px minmax(0,1fr); column-gap: 135px; align-items: start;
}
.home-side { min-width: 0; }
.home-side .portrait { display: block; width: 267px; height: 319px; max-width: 100%; object-fit: cover; object-position: center 38%; border-radius: 10px; }
.home-main { padding-top: 26px; }
/* Particle network only on the home page, visually limited to its lower half. */
.home-with-particles .topbar,
.home-with-particles .home-layout {
  position: relative;
  z-index: 1;
}
.home-with-particles .topbar {
  background: transparent;
}
.home-graph {
  position: fixed;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  margin: 0;
  overflow: hidden;
  pointer-events: none;
  /* Keep the canvas full-viewport for correct cursor coordinates,
     but show particles only below the midpoint, fading in softly. */
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, transparent 50%, #000 65%, #000 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, transparent 50%, #000 65%, #000 100%);
}
.home-graph #home-graph-particles {
  width: 100%;
  height: 100%;
}
.home-graph .particles-js-canvas-el {
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.home-main h1,.home-main h2,.home-main h3 { font-weight: 300; }
main { min-width: 0; }
h1,h2,h3 { font-family: "Lato",Arial,Helvetica,sans-serif; font-weight: 700; }
h1 { font-size: 23px; line-height: 1.35; margin: 0 0 18px; }
h2 { font-size: 19px; line-height: 1.4; margin: 0 0 10px; }
h2:not(:first-child) { margin-top: 25px; }
h3 { font-size: 18px; }
p { margin: 0 0 10px; }
ul { margin: 12px 0 26px; padding-left: 38px; }
li { margin: 0 0 9px; }
.page-main { max-width: 1120px; width: calc(100% - 92px); margin: 52px auto 90px; }
.page-main h1:not(:first-child) { margin-top: 35px; }
.page-publications h1 { font-weight: 300; }
.page-activities h1,.page-activities h2,.page-activities h3,
.page-notes h1,.page-notes h2,.page-notes h3,
.page-personal h1,.page-personal h2,.page-personal h3 { font-weight: 300; }
.page-personal > p:first-child { font-family: "Lato",Arial,Helvetica,sans-serif; font-weight: 300; }
.page-personal img { max-width: 100%; height: auto; border-radius: 10px; }
.personal-columns { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:32px; align-items:start; margin-top:22px; }
.personal-columns > section { min-width:0; }
.personal-columns h2 { margin:0 0 14px; font-family:"Lato",Arial,Helvetica,sans-serif; font-size:1em; line-height:1.4; font-weight:300; }
.personal-art-gallery { display:flex; flex-wrap:wrap; align-items:flex-start; gap:18px; }
.personal-meme-gallery { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; align-items:start; }
.personal-meme-gallery a { display:block; min-width:0; }
.personal-meme-gallery img { display:block; width:100%; height:auto; object-fit:contain; }
.page-publications a { color: #c62828; }
.page-publications li { margin-bottom: 22px; }
@media (max-width: 1260px) {
  .home-layout { column-gap: clamp(45px,9vw,135px); }
}
@media (max-width: 850px) {
  .personal-columns { grid-template-columns:1fr; gap:34px; }
  .home-layout { grid-template-columns: 220px minmax(0,1fr); column-gap: 38px; }
  .home-side .portrait { width: 220px; height: 275px; }
  .topbar nav { gap: 25px; }
  .topbar nav a { font-size: 19.5px; }
}
@media (max-width: 660px) {
  body { font-size: 16px; line-height: 1.67; }
  .topbar { height: auto; min-height: 55px; padding: 8px 16px; flex-wrap: wrap; gap: 6px 14px; }
  .topbar .site-name { font-size: 23px; }
  .topbar nav { order: 2; width: 100%; margin: 0; flex-wrap: wrap; gap: 8px 18px; }
  .home-layout { display: block; width: auto; margin: 23px 19px 65px; }
  .home-side .portrait { width: min(267px,100%); height: auto; aspect-ratio: 267/319; object-fit: cover; }
  .home-main { padding-top: 25px; }
  .page-main { width: auto; margin: 30px 19px 65px; }
  h1 { font-size: 22px; }
  h2 { font-size: 19px; }
  ul { padding-left: 25px; }
}

</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Personal academic webpage of Priyanshu Pant">
<title>{{ page.title | escape }}</title>
<link rel="icon" type="image/png" sizes="32x32" href="/tab-empty-{{ page.page_key | default: 'home' }}-v4.png">
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" sizes="180x180" href="/touch-empty-v4.png">
</head>
<body{% if page.page_key == 'home' %} class="home-with-particles"{% endif %}>
{% if page.page_key == 'home' %}
<section class="home-graph" aria-label="Subtle interactive particle background in the lower half of the home page">
  <div id="home-graph-particles" aria-hidden="true"></div>
</section>
{% endif %}
<header class="topbar">
<a class="site-name" href="index.html">Priyanshu Pant</a>
<nav aria-label="Main navigation">
<a href="index.html"{% if page.page_key == 'home' %} aria-current="page"{% endif %}>Home</a>
<a href="publications.html"{% if page.page_key == 'publications' %} aria-current="page"{% endif %}>Papers</a>
<a href="activities.html"{% if page.page_key == 'activities' %} aria-current="page"{% endif %}>Activities</a>
<a href="notes.html"{% if page.page_key == 'notes' %} aria-current="page"{% endif %}>Notes</a>
<a href="personal.html"{% if page.page_key == 'personal' %} aria-current="page"{% endif %}>Personal</a>
</nav>
</header>
{% if page.page_key == 'home' %}
<div class="home-layout">
<aside class="home-side">
<img class="portrait" src="portrait.jpg" alt="Priyanshu Pant">
</aside>
<main class="home-main">
{{ content }}

</main>
</div>
{% else %}
<main class="page-main page-{{ page.page_key }}">
{{ content }}
</main>
{% endif %}
{% if page.page_key == 'home' %}
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
<script defer src="/assets/js/home-graph.js?v=5"></script>
{% endif %}

<script data-goatcounter="https://priyanshupant.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
