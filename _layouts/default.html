<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300&amp;display=swap" rel="stylesheet">
<style>
/* Google Sites-like personal academic webpage. */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: white; color: #252525; font: 17px/1.82 Georgia,"Times New Roman",serif; }
a { color: #397be4; text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible { outline: 2px solid #397be4; outline-offset: 3px; }
.topbar {
  height: 55px; padding: 0 18px; background: #050505; color: #f6f6f6;
  display: flex; align-items: center; gap: 16px; width: 100%;
  font-family: "Lato",Arial,Helvetica,sans-serif; font-weight: 300;
}
.topbar .site-name { color: white; font: 300 27px/1.3 "Lato",Arial,Helvetica,sans-serif; white-space: nowrap; }
.topbar .site-name:hover { text-decoration: none; }
.topbar nav { display: flex; align-items: center; gap: 36px; margin-left: auto; }
.topbar nav a { color: #e7e7e7; text-decoration: none; font: 300 21px/1.3 "Lato",Arial,Helvetica,sans-serif; white-space: nowrap; }
.topbar nav a:hover,.topbar nav a[aria-current="page"] { color: #fff; }

/* The illustrative visitor tree is only shown on Home. */
.visitor-tree { float:none; width:280px; max-width:100%; margin:32px 0 0 auto; text-align:center; }
.visitor-tree .visitor-title { font:15px/1.3 Georgia,"Times New Roman",serif; margin:0 0 3px; }
.visitor-tree svg { width:100%; height:auto; display:block; overflow:visible; }
.visitor-tree .visitor-edge { fill:none; stroke:#737b82; stroke-width:1.35; stroke-linecap:round; }
.visitor-tree .visitor-near { stroke:#89a4bc; stroke-dasharray:2 5; }
.visitor-tree .visitor-count { font:11px/1.2 Arial,Helvetica,sans-serif; fill:#666; text-anchor:middle; }
.visitor-tree .visitor-foot { font:10px/1.5 Arial,Helvetica,sans-serif; color:#777; }
.visitor-counter-tracking { position:absolute; left:-9999px; top:0; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none; }
@media(max-width:850px) and (min-width:661px) { .visitor-tree { width:245px; } }
@media(max-width:660px) { .visitor-tree { width:min(270px,100%); margin:25px 0 0 auto; } }

.home-layout {
  width: min(1160px,calc(100% - 52px)); margin: 24px auto 75px;
  display: grid; grid-template-columns: 267px minmax(0,1fr); column-gap: 135px; align-items: start;
}
.home-side { min-width: 0; }
.visitor-counter { margin-top: 12px; }
.visitor-counter img { display: block; max-width: 100%; height: auto; }
.home-side .portrait { display: block; width: 267px; height: 319px; max-width: 100%; object-fit: cover; object-position: center 38%; border-radius: 10px; }
.home-main { padding-top: 26px; }
main { min-width: 0; }
h1,h2,h3 { font-family: Georgia,"Times New Roman",serif; }
h1 { font-size: 23px; line-height: 1.35; margin: 0 0 18px; }
h2 { font-size: 19px; line-height: 1.4; margin: 0 0 10px; }
h2:not(:first-child) { margin-top: 25px; }
h3 { font-size: 18px; }
p { margin: 0 0 10px; }
ul { margin: 12px 0 26px; padding-left: 38px; }
li { margin: 0 0 9px; }
.page-main { max-width: 1120px; width: calc(100% - 92px); margin: 52px auto 90px; }
.page-main h1:not(:first-child) { margin-top: 35px; }
.page-publications li { margin-bottom: 22px; }
.page-personal img { max-width: 100%; height: auto; }
@media (max-width: 1260px) {
  .home-layout { column-gap: clamp(45px,9vw,135px); }
}
@media (max-width: 850px) {
  .home-layout { grid-template-columns: 220px minmax(0,1fr); column-gap: 38px; }
  .home-side .portrait { width: 220px; height: 275px; }
  .topbar nav { gap: 25px; }
  .topbar nav a { font-size: 19.5px; }
}
@media (max-width: 660px) {
  body { font-size: 16px; line-height: 1.67; }
  .topbar { height: auto; min-height: 55px; padding: 8px 16px; flex-wrap: wrap; gap: 6px 14px; }
  .topbar .site-name { font-size: 23px; }
  .topbar nav { order: 2; width: 100%; margin: 0; flex-wrap: wrap; gap: 8px 18px; }
  .home-layout { display: block; width: auto; margin: 23px 19px 65px; }
  .home-side .portrait { width: min(267px,100%); height: auto; aspect-ratio: 267/319; object-fit: cover; }
  .home-main { padding-top: 25px; }
  .page-main { width: auto; margin: 30px 19px 65px; }
  h1 { font-size: 22px; }
  h2 { font-size: 19px; }
  ul { padding-left: 25px; }
}
</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Personal academic webpage of Priyanshu Pant">
<title>{{ page.title | escape }} — Priyanshu Pant</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
</head>
<body>
<header class="topbar">
<a class="site-name" href="index.html">Priyanshu Pant</a>
<nav aria-label="Main navigation">
<a href="index.html"{% if page.page_key == 'home' %} aria-current="page"{% endif %}>Home</a>
<a href="publications.html"{% if page.page_key == 'publications' %} aria-current="page"{% endif %}>Research</a>
<a href="activities.html"{% if page.page_key == 'activities' %} aria-current="page"{% endif %}>Activities</a>
<a href="notes.html"{% if page.page_key == 'notes' %} aria-current="page"{% endif %}>Notes</a>
<a href="personal.html"{% if page.page_key == 'personal' %} aria-current="page"{% endif %}>Personal</a>
</nav>
</header>
{% if page.page_key == 'home' %}
<div class="home-layout">
<aside class="home-side">
<img class="portrait" src="portrait.jpg" alt="Priyanshu Pant">
<div class="visitor-counter visitor-counter-tracking" aria-hidden="true">
<a href="https://info.flagcounter.com/mvlt" tabindex="-1">
  <img src="https://s01.flagcounter.com/count2/mvlt/bg_FFFFFF/txt_000000/border_FFFFFF/columns_2/maxflags_6/viewers_0/labels_0/pageviews_0/flags_0/percent_0/" alt="Flag Counter" border="0">
</a>
</div>
</aside>
<main class="home-main">
{{ content }}
<aside class="visitor-tree" aria-label="Illustrative weighted country visitor network at the bottom-right of the homepage">
  <div class="visitor-title">Visitors</div>
  <svg viewBox="0 0 280 280" role="img" aria-label="Illustrative country tree. Country flags are vertices, larger vertices have larger sample visit counts. Solid edges link land-border neighbours and dotted edges link other nearby countries.">
    <path d="M139 43 Q96 64 76 105" class="visitor-edge visitor-near"/>
    <path d="M139 43 Q183 60 213 105" class="visitor-edge"/>
    <path d="M76 105 Q39 137 38 176" class="visitor-edge visitor-near"/>
    <path d="M213 105 Q208 146 191 176" class="visitor-edge visitor-near"/>
    <path d="M191 176 Q237 207 245 244" class="visitor-edge visitor-near"/>
    <g transform="translate(139 43)"><title>France: 75 example visits</title><circle r="16" fill="#fff" stroke="#787e84" stroke-width="1.1"/><text x="0" y="6" font-size="24" text-anchor="middle" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif">🇫🇷</text><text class="visitor-count" x="0" y="30">75</text></g>
    <g transform="translate(76 105)"><title>United Kingdom: 34 example visits</title><circle r="13" fill="#fff" stroke="#787e84" stroke-width="1.1"/><text x="0" y="6" font-size="20.8" text-anchor="middle" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif">🇬🇧</text><text class="visitor-count" x="0" y="27">34</text></g>
    <g transform="translate(213 105)"><title>Germany: 96 example visits</title><circle r="17" fill="#fff" stroke="#787e84" stroke-width="1.1"/><text x="0" y="6" font-size="24" text-anchor="middle" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif">🇩🇪</text><text class="visitor-count" x="0" y="31">96</text></g>
    <g transform="translate(38 176)"><title>United States: 180 example visits</title><circle r="20" fill="#fff" stroke="#787e84" stroke-width="1.1"/><text x="0" y="6" font-size="24" text-anchor="middle" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif">🇺🇸</text><text class="visitor-count" x="0" y="34">180</text></g>
    <g transform="translate(191 176)"><title>India: 482 example visits</title><circle r="27" fill="#fff" stroke="#787e84" stroke-width="1.1"/><text x="0" y="6" font-size="24" text-anchor="middle" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif">🇮🇳</text><text class="visitor-count" x="0" y="41">482</text></g>
    <g transform="translate(245 244)"><title>Japan: 42 example visits</title><circle r="14" fill="#fff" stroke="#787e84" stroke-width="1.1"/><text x="0" y="6" font-size="22.400000000000002" text-anchor="middle" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif">🇯🇵</text><text class="visitor-count" x="0" y="28">42</text></g>
  </svg>
  <div class="visitor-foot">Sample counts · <a href="https://info.flagcounter.com/mvlt" target="_blank" rel="noopener noreferrer">Actual visitor statistics ↗</a></div>
</aside>
</main>
</div>
{% else %}
<main class="page-main page-{{ page.page_key }}">
{{ content }}
</main>
{% endif %}
</body>
</html>
